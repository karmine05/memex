<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memex · live telemetry</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: #000; color: #dfe6f3;
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(900px 600px at 8% 6%, rgba(30, 90, 160, .10), transparent 65%),
      radial-gradient(900px 600px at 92% 8%, rgba(30, 90, 160, .08), transparent 65%),
      radial-gradient(900px 600px at 8% 94%, rgba(20, 60, 130, .08), transparent 65%),
      radial-gradient(900px 600px at 92% 94%, rgba(20, 60, 130, .10), transparent 65%),
      #000;
  }
  #c { position: fixed; inset: 0; z-index: 1; display: block; cursor: grab; }
  #c:active { cursor: grabbing; }
  .panel {
    position: fixed; z-index: 3;
    background: linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.02) 40%, rgba(110,180,255,.06) 100%);
    border: 1px solid rgba(160, 200, 255, .22);
    backdrop-filter: blur(18px) saturate(1.5);
    -webkit-backdrop-filter: blur(18px) saturate(1.5);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 10px 40px rgba(0,0,0,.5);
    overflow: hidden;
    border-radius: 22px;
  }
  #top {
    top: 14px; left: 14px; right: 262px; display: flex; align-items: center;
    gap: 14px; padding: 10px 18px;
  }
  #top .logo { font-size: 16px; letter-spacing: .18em; font-weight: 700; color: #fff;
    text-shadow: 0 0 18px rgba(110,180,255,.6); }
  #top .logo em { font-style: normal; color: #6fd3ff; }
  #top .sub { color: #7b87a3; font-size: 11px; }
  .chip { margin-left: auto; display: flex; gap: 12px; align-items: center;
    font-size: 11px; white-space: nowrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 5px; background: #444; }
  .ok   { color: #43e08a; } .ok .dot   { background: #43e08a; box-shadow: 0 0 10px #43e08a99; }
  .bad  { color: #ff5d6c; } .bad .dot  { background: #ff5d6c; box-shadow: 0 0 10px #ff5d6c99; }
  .warn { color: #ffc857; } .warn .dot { background: #ffc857; box-shadow: 0 0 10px #ffc85799; }
  #feed {
    top: 76px; right: 14px; width: 238px; bottom: 16px; padding: 10px 12px;
    display: flex; flex-direction: column;
  }
  #feed h3, #agents h3 {
    margin: 0 0 8px; font-size: 10px; letter-spacing: .22em; color: #9fb4d8;
    font-weight: 600;
  }
  #feedlist { overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .ev { font-size: 11px; color: #c4d1e8; border-left: 2px solid #3b6fd4; padding-left: 7px; }
  .ev.used { border-color: #6fd3ff; }
  .ev.sent { border-color: #ffb14a; }
  .ev.cited, .ev.wrote { border-color: #59f28e; }
  .ev .t { color: #66738f; margin-right: 6px; font-size: 10px; display: block; }
  .ev .who { color: #fff; }
  #agents { left: 14px; top: 76px; width: 252px; padding: 10px 12px; max-height: 360px; overflow: auto; }
  .ag { display: flex; gap: 8px; align-items: baseline; font-size: 11px; padding: 2px 0; }
  .ag .nm { color: #dfe6f3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ag .tm { margin-left: auto; color: #66738f; font-size: 10px; white-space: nowrap; }
  #legend { left: 14px; bottom: 14px; padding: 8px 12px; font-size: 10px; color: #9fb4d8; }
  #legend .sw { display: inline-block; width: 16px; height: 2px; vertical-align: middle; margin-right: 6px;
    box-shadow: 0 0 6px currentColor; }
  #hint { position: fixed; z-index: 3; right: 268px; bottom: 16px; color: #5c6a8a; font-size: 10px; }
  #lost {
    position: fixed; z-index: 5; top: 0; left: 0; right: 0; display: none;
    background: rgba(59, 18, 32, .9); color: #ffb3bd; text-align: center;
    padding: 6px; font-size: 12px;
  }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="c"></canvas>
<div id="lost">connection lost — reconnecting…</div>
<div id="top" class="panel">
  <span class="logo">MEM<em>EX</em></span>
  <span class="sub">agent neural network · live telemetry</span>
  <span class="chip">
    <span id="ch-db" class="warn"><span class="dot"></span>db …</span>
    <span id="ch-emb" class="warn"><span class="dot"></span>embedder …</span>
    <span id="ch-sse" class="warn"><span class="dot"></span>streams …</span>
  </span>
</div>
<div id="agents" class="panel"><h3>AGENTS</h3><div id="agentlist"></div></div>
<div id="feed" class="panel"><h3>ACTIVITY</h3><div id="feedlist"></div></div>
<div id="legend" class="panel">
  <div style="color:#6fd3ff"><span class="sw" style="background:#6fd3ff"></span>used a note</div>
  <div style="color:#ffb14a"><span class="sw" style="background:#ffb14a"></span>sent a DM</div>
  <div style="color:#59f28e"><span class="sw" style="background:#59f28e"></span>wrote / cited</div>
</div>
<div id="hint">drag to orbit · scroll to zoom · pulses travel on live links</div>
<script>
"use strict";
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = devicePixelRatio || 1;
  W = cv.width = innerWidth * DPR;
  H = cv.height = innerHeight * DPR;
  cv.style.width = innerWidth + 'px';
  cv.style.height = innerHeight + 'px';
}
addEventListener('resize', resize);
resize();

function rand(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function nrm(v) { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l]; }
function add(a, b, s) { return [a[0]+b[0]*s, a[1]+b[1]*s, a[2]+b[2]*s]; }
function cross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
const TAU = Math.PI * 2;
const BALL = [12.6, 9.4, 11.4];
function mix3(a, b, t) { return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
const RED = [1.0, 0.22, 0.08], AMBER = [1.0, 0.48, 0.14], GREEN = [0.28, 0.86, 0.52],
      TEAL = [0.18, 0.78, 0.92], BLUE = [0.22, 0.42, 1.0];
function strandColor(t, green) {
  if (t < 0.18) return mix3(RED, AMBER, t / 0.18);
  if (t < 0.50) return mix3(AMBER, green ? GREEN : TEAL, (t - 0.18) / 0.32);
  return mix3(green ? GREEN : TEAL, BLUE, Math.min(1, (t - 0.50) / 0.50));
}
function clampUnit(p, maxR) {
  const r = Math.hypot(p[0], p[1], p[2]);
  if (r <= maxR) return p;
  const s = maxR / r;
  return [p[0] * s, p[1] * s, p[2] * s];
}
function toWorld(p) { return [p[0] * BALL[0], p[1] * BALL[1], p[2] * BALL[2]]; }
function unitR(p) { return Math.hypot(p[0] / BALL[0], p[1] / BALL[1], p[2] / BALL[2]); }

const strands = [];
const lights = [];
const MAX_STRANDS = 1400;
function grow(seed, pos, dir, depth, maxDepth, hang, green) {
  if (strands.length >= MAX_STRANDS) return;
  const segs = 8 + (depth === 0 ? 6 : 0);
  const len = (0.34 - depth * 0.04) * (0.72 + rand(seed + 3) * 0.55);
  const pts = [toWorld(pos)];
  let p = pos.slice(), d = dir.slice();
  const perp = nrm(cross(d, Math.abs(d[1]) > 0.8 ? [1, 0, 0] : [0, 1, 0]));
  const bin = nrm(cross(d, perp));
  const w1 = 0.9 + rand(seed + 5) * 1.8, ph = rand(seed + 7) * TAU;
  const amp = 0.12 + rand(seed + 9) * 0.18;
  const cap = hang ? 1.18 : 0.995;
  for (let j = 1; j <= segs; j++) {
    const t = j / segs;
    d = nrm(add(d, add(perp, bin, Math.sin(t * w1 * TAU + ph) * amp), 0.18));
    p = add(p, d, len / segs);
    p = clampUnit(p, cap);
    pts.push(toWorld(p));
  }
  const endR = Math.min(1, Math.hypot(p[0], p[1], p[2]));
  strands.push({ pts, endR, depth, green: !!green });
  if (rand(seed + 11) > 0.62) {
    const mid = pts[Math.floor(pts.length * (0.45 + rand(seed + 13) * 0.4))];
    lights.push({ p: mid, r: endR, ph: rand(seed + 17) * TAU, green: !!green });
  }
  if (depth >= maxDepth) return;
  const splits = depth < 2 ? 2 : (rand(seed + 19) > 0.35 ? 2 : 1);
  for (let k = 0; k < splits; k++) {
    const yaw = (rand(seed + 23 + k) - 0.5) * 1.05;
    const pit = (rand(seed + 29 + k) - 0.5) * 0.85;
    const nd = nrm(add(add(d, perp, yaw), bin, pit));
    grow(seed * 1.7 + k * 97 + depth * 13, p, nd, depth + 1, maxDepth, hang, green);
  }
}
(function buildBrain() {
  for (let i = 0; i < 56; i++) {
    const u = rand(i * 3 + 1) * 2 - 1, ph = rand(i * 5 + 2) * TAU, s = Math.sqrt(1 - u * u);
    const dir = nrm([s * Math.cos(ph), u * 0.78, s * Math.sin(ph)]);
    const startR = 0.06 + rand(i * 11) * 0.08;
    const start = [dir[0] * startR, dir[1] * startR, dir[2] * startR];
    grow(i + 1, start, dir, 0, 4, false, i % 13 === 0);
  }
  for (let i = 0; i < 14; i++) {
    const ph = rand(i * 41 + 3) * TAU;
    const dir = nrm([Math.cos(ph) * 0.4, -0.92 - rand(i * 43) * 0.12, Math.sin(ph) * 0.4]);
    grow(900 + i, [dir[0] * 0.1, -0.18, dir[2] * 0.1], dir, 0, 2, true, false);
  }
})();

const stars = [];
for (let i = 0; i < 420; i++) {
  const u = rand(i + 900) * 2 - 1, ph = rand(i + 700) * TAU;
  const r = 48 + rand(i + 500) * 38, s = Math.sqrt(1 - u * u);
  stars.push([r * s * Math.cos(ph) * 1.35, r * u * 1.1, r * s * Math.sin(ph) * 1.35, 0.4 + rand(i) * 1.1, rand(i + 300) * TAU]);
}

let nodes = [], edges = [];
let nodePos = new Map(), nodeMeta = new Map(), nodeExcite = new Map(), nodeBase = new Map();
let edgeObjs = [];
const KIND_COLOR = { used: [0.40, 0.68, 1.0], sent: [1.0, 0.62, 0.22], cited: [0.32, 0.90, 0.55], wrote: [0.32, 0.90, 0.55] };
const KIND_SPEED = { used: 0.16, sent: 0.38, cited: 0.24, wrote: 0.2 };

function layout() {
  nodePos = new Map(); nodeMeta = new Map();
  const n = nodes.length;
  const golden = Math.PI * (3 - Math.sqrt(5));
  nodes.forEach((nd, i) => {
    const y = n === 1 ? 0 : 1 - (i / (n - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = golden * i + rand(i) * 0.4;
    const rad = 0.28 + rand(i + 40) * 0.55;
    const x = Math.cos(th) * r * rad * BALL[0];
    const yy = y * rad * BALL[1];
    const z = Math.sin(th) * r * rad * BALL[2];
    nodePos.set(nd.id, [x, yy, z]);
    nodeMeta.set(nd.id, { pos: [x, yy, z], name: nd.name, active: nd.status === 'active' });
  });
  edgeObjs = [];
  edges.forEach((e, i) => {
    const A = nodePos.get(e.from), B = nodePos.get(e.to);
    if (!A || !B) return;
    const mid = [(A[0]+B[0])/2, (A[1]+B[1])/2, (A[2]+B[2])/2];
    let nrmv = nrm(cross([B[0]-A[0], B[1]-A[1], B[2]-A[2]], [0, 1, 0.3]));
    const off = (Math.hypot(B[0]-A[0], B[1]-A[1], B[2]-A[2]) * 0.18 + 0.8) * (rand(i * 61) > 0.5 ? 1 : -1);
    const C = [mid[0]+nrmv[0]*off, mid[1]+nrmv[1]*off, mid[2]+nrmv[2]*off];
    const pulses = [];
    const np = 1 + (e.kind === 'sent' ? 1 : 0);
    for (let k = 0; k < np; k++) pulses.push({ seed: rand(i * 67 + k), speed: KIND_SPEED[e.kind] || 0.2 });
    edgeObjs.push({ A, C, B, kind: e.kind || 'used', f: Math.min((e.count || 1) / 8, 1), act: 0.35, pulses, from: e.from, to: e.to });
  });
}
function qbez(A, C, B, u) {
  const w0 = (1-u)*(1-u), w1 = 2*(1-u)*u, w2 = u*u;
  return [w0*A[0]+w1*C[0]+w2*B[0], w0*A[1]+w1*C[1]+w2*B[1], w0*A[2]+w1*C[2]+w2*B[2]];
}

let camT = { az: 0.85, el: 0.12, r: 23 }, cam = { az: 0.85, el: 0.12, r: 23 };
let dragging = false, lx = 0, ly = 0;
cv.addEventListener('mousedown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
addEventListener('mouseup', () => dragging = false);
addEventListener('mousemove', e => {
  if (!dragging) return;
  camT.az -= (e.clientX - lx) * 0.005;
  camT.el = Math.max(-1.25, Math.min(1.25, camT.el + (e.clientY - ly) * 0.005));
  lx = e.clientX; ly = e.clientY;
});
addEventListener('wheel', e => { camT.r = Math.max(18, Math.min(70, camT.r + e.deltaY * 0.02)); }, { passive: true });

function lookBasis() {
  const ca = Math.cos(cam.az), sa = Math.sin(cam.az), ce = Math.cos(cam.el), se = Math.sin(cam.el);
  const ex = cam.r * ce * ca, ey = cam.r * se, ez = cam.r * ce * sa;
  const fx = -ex, fy = -ey, fz = -ez;
  const fl = Math.hypot(fx, fy, fz) || 1;
  const f = [fx / fl, fy / fl, fz / fl];
  let r = nrm(cross([0, 1, 0], f));
  if (Math.hypot(r[0], r[1], r[2]) < 1e-5) r = nrm(cross([1, 0, 0], f));
  const u = cross(f, r);
  return { ex, ey, ez, r, u, f };
}
function project(x, y, z, basis) {
  const dx = x - basis.ex, dy = y - basis.ey, dz = z - basis.ez;
  const cx = dx * basis.r[0] + dy * basis.r[1] + dz * basis.r[2];
  const cy = dx * basis.u[0] + dy * basis.u[1] + dz * basis.u[2];
  const depth = dx * basis.f[0] + dy * basis.f[1] + dz * basis.f[2];
  const d = Math.max(0.4, depth);
  const f = Math.min(W, H) * 1.25;
  return [W / 2 + (cx * f) / d, H / 2 - (cy * f) / d, d];
}

const t0 = performance.now();
let lastT = t0;
function frame() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const t = (now - t0) / 1000;
  if (!dragging) camT.az += 0.00055;
  cam.az += (camT.az - cam.az) * 0.08;
  cam.el += (camT.el - cam.el) * 0.08;
  cam.r += (camT.r - cam.r) * 0.08;
  for (const eo of edgeObjs) eo.act *= Math.exp(-dt * 0.9);
  for (const [id, e] of nodeExcite) nodeExcite.set(id, e * Math.exp(-dt * 1.4));

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const basis = lookBasis();

  for (const st of stars) {
    const [px, py, d] = project(st[0], st[1], st[2], basis);
    if (d < 1) continue;
    const a = (0.35 + 0.45 * Math.sin(t * 0.7 + st[4])) * Math.max(0, 0.85 - d / 180);
    ctx.fillStyle = 'rgba(120,180,230,' + a.toFixed(3) + ')';
    const r = Math.max(0.6, st[3] * (Math.min(W, H) / d) * 0.04);
    ctx.fillRect(px, py, r, r);
  }

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const sd of strands) {
    for (let i = 1; i < sd.pts.length; i++) {
      const a = sd.pts[i - 1], b = sd.pts[i];
      const t = Math.min(1, (unitR(a) + unitR(b)) * 0.5);
      const c = strandColor(t, sd.green);
      const alpha = 0.16 + 0.38 * t;
      ctx.strokeStyle = 'rgba(' + Math.round(c[0]*255) + ',' + Math.round(c[1]*255) + ',' + Math.round(c[2]*255) + ',' + alpha.toFixed(3) + ')';
      ctx.lineWidth = Math.max(0.35, (0.55 + 0.35 * (1 - t) - sd.depth * 0.04) * DPR);
      ctx.beginPath();
      const p0 = project(a[0], a[1], a[2], basis);
      const p1 = project(b[0], b[1], b[2], basis);
      if (p0[2] < 0.6 || p1[2] < 0.6) continue;
      ctx.moveTo(p0[0], p0[1]);
      ctx.lineTo(p1[0], p1[1]);
      ctx.stroke();
    }
  }

  for (const tl of lights) {
    const [px, py, d] = project(tl.p[0], tl.p[1], tl.p[2], basis);
    if (d < 1) continue;
    const tw = 0.45 + 0.5 * Math.sin(t * 0.9 + tl.ph);
    const c = strandColor(Math.min(1, tl.r), tl.green);
    ctx.fillStyle = 'rgba(' + Math.round(c[0]*255) + ',' + Math.round(c[1]*255) + ',' + Math.round(c[2]*255) + ',' + (tw * 0.85).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(px, py, Math.max(0.7, 18 / d), 0, TAU); ctx.fill();
  }

  const core = project(0, 0, 0, basis);
  if (core[2] > 0.6) {
    const size = 6 * (24 / core[2]);
    const g = ctx.createRadialGradient(core[0], core[1], 0, core[0], core[1], size * 4);
    g.addColorStop(0, 'rgba(255,210,140,0.95)');
    g.addColorStop(0.25, 'rgba(255,110,40,0.55)');
    g.addColorStop(1, 'rgba(255,80,20,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(core[0], core[1], size * 4, 0, TAU); ctx.fill();
  }

  for (const eo of edgeObjs) {
    const c = KIND_COLOR[eo.kind] || KIND_COLOR.used;
    const a = 0.22 + 0.45 * Math.min(1, eo.act + eo.f);
    ctx.strokeStyle = 'rgba(' + Math.round(c[0]*255) + ',' + Math.round(c[1]*255) + ',' + Math.round(c[2]*255) + ',' + a.toFixed(2) + ')';
    ctx.lineWidth = Math.max(0.8, (1.2 + eo.act) * DPR);
    ctx.beginPath();
    for (let j = 0; j <= 16; j++) {
      const p = qbez(eo.A, eo.C, eo.B, j / 16);
      const [px, py] = project(p[0], p[1], p[2], basis);
      if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    for (const pu of eo.pulses) {
      const u = (t * pu.speed + pu.seed) % 1;
      const p = qbez(eo.A, eo.C, eo.B, u);
      const [px, py, d] = project(p[0], p[1], p[2], basis);
      if (d < 1) continue;
      const b = 0.4 + 0.6 * Math.min(eo.act + eo.f, 1.4);
      ctx.fillStyle = 'rgba(' + Math.round(c[0]*255) + ',' + Math.round(c[1]*255) + ',' + Math.round(c[2]*255) + ',' + b.toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(px, py, Math.max(1.4, 26 / d * b), 0, TAU); ctx.fill();
    }
  }

  ctx.font = (11 * DPR) + 'px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (const nd of nodes) {
    const m = nodeMeta.get(nd.id);
    if (!m) continue;
    const e = (nodeExcite.get(nd.id) || 0) + (nodeBase.get(nd.id) || 0);
    const [px, py, d] = project(m.pos[0], m.pos[1], m.pos[2], basis);
    if (d < 1) continue;
    const size = Math.max(2.2, (m.active ? 5.5 : 3.2) * (1 + 0.8 * Math.min(e, 1.6)) * (22 / d));
    const g = ctx.createRadialGradient(px, py, 0, px, py, size * 3.2);
    g.addColorStop(0, 'rgba(255,255,255,' + Math.min(1, 0.55 + 0.45 * e).toFixed(2) + ')');
    g.addColorStop(0.3, 'rgba(110,210,255,' + (0.4 + 0.5 * Math.min(e, 1)).toFixed(2) + ')');
    g.addColorStop(1, 'rgba(110,210,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, size * 3.2, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(210,230,255,' + (0.55 + 0.4 * Math.min(e, 1)).toFixed(2) + ')';
    ctx.fillText(m.name, px, py + size * 1.6);
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const $ = id => document.getElementById(id);
function setChip(id, cls, label) {
  const el = $(id);
  el.className = cls;
  el.innerHTML = '<span class="dot"></span>' + label;
}
function relTime(iso) {
  if (!iso) return 'never';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return Math.floor(s) + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}
function clock(iso) {
  const d = iso ? new Date(iso) : new Date();
  return [d.getHours(), d.getMinutes(), d.getSeconds()].map(x => String(x).padStart(2, '0')).join(':');
}
function esc(s) {
  return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function aid(a) { return a.id || a.agent_id; }

let lostShown = false, prevAgentIds = '', seenAct = new Set(), bootstrapped = false;

function actKey(ev) { return (ev.at || '') + '|' + (ev.kind || '') + '|' + (ev.actor || '') + '|' + (ev.other || '') + '|' + (ev.from || '') + '|' + (ev.to || ''); }
function actMsg(ev) {
  if (ev.kind === 'used') return '<span class="who">' + esc(ev.actor) + '</span> used a note by <span class="who">' + esc(ev.other) + '</span>';
  if (ev.kind === 'sent') return '<span class="who">' + esc(ev.actor) + '</span> sent a DM to <span class="who">' + esc(ev.other || 'peer') + '</span>';
  if (ev.kind === 'cited') return '<span class="who">' + esc(ev.actor) + '</span> cited <span class="who">' + esc(ev.other) + '</span>';
  if (ev.kind === 'wrote') return '<span class="who">' + esc(ev.actor) + '</span> wrote in ' + esc(ev.space || 'a space');
  return esc(ev.kind || 'event');
}
function renderFeed(list) {
  const el = $('feedlist');
  el.innerHTML = '';
  if (!list.length) {
    const empty = document.createElement('div');
    empty.className = 'ev';
    empty.textContent = 'no agent traffic yet';
    el.appendChild(empty);
    return;
  }
  for (const ev of list.slice(0, 40)) {
    const row = document.createElement('div');
    row.className = 'ev ' + (ev.kind || '');
    row.innerHTML = '<span class="t">' + clock(ev.at) + ' · ' + relTime(ev.at) + '</span>' + actMsg(ev);
    el.appendChild(row);
  }
}
function flashEdge(from, to) {
  for (const eo of edgeObjs) {
    if ((eo.from === from && eo.to === to) || (eo.from === to && eo.to === from)) {
      eo.act = Math.min(1.6, eo.act + 1.0);
    }
  }
  if (from) nodeExcite.set(from, Math.min(2.5, (nodeExcite.get(from) || 0) + 1.2));
  if (to) nodeExcite.set(to, Math.min(2.5, (nodeExcite.get(to) || 0) + 1.2));
}

async function poll() {
  try {
    const [tz, gr] = await Promise.all([
      fetch('/admin/telemetry').then(r => { if (!r.ok) throw new Error('telemetry ' + r.status); return r.json(); }),
      fetch('/admin/graph').then(r => { if (!r.ok) throw new Error('graph ' + r.status); return r.json(); }),
    ]);
    $('lost').style.display = 'none'; lostShown = false;
    const hz = tz.health || {}, ag = tz.agents || [];
    setChip('ch-db', hz.db === 'ok' ? 'ok' : 'bad', 'db ' + (hz.db || '?'));
    setChip('ch-emb', hz.embedder === 'ok' ? 'ok' : 'warn', 'embedder ' + (hz.embedder || '?'));
    setChip('ch-sse', 'ok', 'streams ' + (hz.streams || 0));

    nodes = (gr.nodes || []).map(n => ({ id: n.id, name: n.name, status: n.status }));
    edges = gr.edges || [];
    const ids = nodes.map(x => x.id).sort().join(',');
    if (ids !== prevAgentIds) {
      layout();
      prevAgentIds = ids;
    }
    for (const a of ag) {
      const id = aid(a);
      const s = a.last_active ? Math.max(0, (Date.now() - new Date(a.last_active).getTime()) / 1000) : 1e9;
      nodeBase.set(id, Math.max(0, 0.35 * (1 - s / 10800)));
    }
    $('agentlist').innerHTML = ag.map(a =>
      '<div class="ag"><span class="dot ' + (a.status === 'active' ? 'ok' : 'warn') + '" style="width:6px;height:6px"></span>' +
      '<span class="nm">' + esc(a.name) + '</span><span class="tm">' + relTime(a.last_active) + '</span></div>'
    ).join('');

    const activity = tz.activity || [];
    if (!bootstrapped) {
      for (const ev of activity) seenAct.add(actKey(ev));
      renderFeed(activity);
      bootstrapped = true;
    } else {
      const fresh = [];
      for (const ev of activity) {
        const k = actKey(ev);
        if (seenAct.has(k)) continue;
        seenAct.add(k);
        fresh.push(ev);
        flashEdge(ev.from, ev.to);
      }
      if (fresh.length) {
        const merged = fresh.concat(activity.filter(ev => !fresh.includes(ev)));
        renderFeed(merged);
      }
    }
  } catch (e) {
    if (!lostShown) { $('lost').style.display = 'block'; lostShown = true; }
  }
}
setInterval(poll, 2000);
poll();
</script>
