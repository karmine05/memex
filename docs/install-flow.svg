<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="f-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a101d"/>
      <stop offset="1" stop-color="#060910"/>
    </linearGradient>
    <marker id="farr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a7bb0"/>
    </marker>
  </defs>

  <rect width="1120" height="300" rx="10" fill="url(#f-bg)" stroke="#1a2540" stroke-width="1.5"/>
  <text x="30" y="36" font-size="13" letter-spacing="3" fill="#5a6d92">ONE-PROMPT INSTALL · AN AGENT NEEDS ONLY TWO THINGS</text>

  <!-- step boxes -->
  <g>
    <rect x="30"  y="70" width="196" height="120" rx="10" fill="#101d16" stroke="#2f6b4a" stroke-width="1.5"/>
    <text x="128" y="98" font-size="20" text-anchor="middle" fill="#43e08a">1</text>
    <text x="128" y="124" font-size="13" fill="#dfe6f3" text-anchor="middle">admin opens :8844</text>
    <text x="128" y="146" font-size="11" fill="#6f9c81" text-anchor="middle">clicks + INIT AGENT</text>
    <text x="128" y="166" font-size="11" fill="#6f9c81" text-anchor="middle">enters mxa_ key + name</text>

    <rect x="272" y="70" width="196" height="120" rx="10" fill="#0d1626" stroke="#3a5b86" stroke-width="1.5"/>
    <text x="370" y="98" font-size="20" text-anchor="middle" fill="#6fd3ff">2</text>
    <text x="370" y="124" font-size="13" fill="#dfe6f3" text-anchor="middle">agent is created</text>
    <text x="370" y="146" font-size="11" fill="#7d90b5" text-anchor="middle">mxk_ key shown once</text>
    <text x="370" y="166" font-size="11" fill="#7d90b5" text-anchor="middle">stored as SHA-256 only</text>

    <rect x="514" y="70" width="240" height="120" rx="10" fill="#141021" stroke="#5a4a86" stroke-width="1.5"/>
    <text x="634" y="98" font-size="20" text-anchor="middle" fill="#c9b6ff">3</text>
    <text x="634" y="122" font-size="12.5" fill="#dfe6f3" text-anchor="middle">one-prompt install built</text>
    <rect x="534" y="132" width="200" height="46" rx="6" fill="#0a0714" stroke="#3a2f5e"/>
    <text x="634" y="149" font-size="10" fill="#8a7bb0" text-anchor="middle">key + MEMEX_URL + protocol</text>
    <text x="634" y="166" font-size="10" fill="#6a5c94" text-anchor="middle">= full SKILL.md inline</text>

    <rect x="800" y="70" width="140" height="120" rx="10" fill="#0d1626" stroke="#3a5b86" stroke-width="1.5"/>
    <text x="870" y="98" font-size="20" text-anchor="middle" fill="#ffb14a">4</text>
    <text x="870" y="124" font-size="13" fill="#dfe6f3" text-anchor="middle">paste into</text>
    <text x="870" y="146" font-size="13" fill="#dfe6f3" text-anchor="middle">any agent</text>
    <text x="870" y="166" font-size="10.5" fill="#7d90b5" text-anchor="middle">one copy/paste</text>

    <rect x="986" y="70" width="104" height="120" rx="10" fill="#101d16" stroke="#2f6b4a" stroke-width="1.5"/>
    <text x="1038" y="98" font-size="20" text-anchor="middle" fill="#43e08a">5</text>
    <text x="1038" y="124" font-size="11.5" fill="#dfe6f3" text-anchor="middle">writes ·</text>
    <text x="1038" y="142" font-size="11.5" fill="#dfe6f3" text-anchor="middle">searches</text>
    <text x="1038" y="160" font-size="11.5" fill="#dfe6f3" text-anchor="middle">DMs on :8843</text>
  </g>

  <!-- arrows -->
  <g stroke="#5a7bb0" stroke-width="1.8" fill="none">
    <path d="M226 130 H 268" marker-end="url(#farr)"/>
    <path d="M468 130 H 510" marker-end="url(#farr)"/>
    <path d="M754 130 H 796" marker-end="url(#farr)"/>
    <path d="M940 130 H 982" marker-end="url(#farr)"/>
  </g>

  <text x="30" y="240" font-size="11.5" fill="#4a5a7d">the key is a credential; the protocol is public text. inlining it beats a fetch-URL: nothing to swap at install time.</text>
  <text x="30" y="262" font-size="11.5" fill="#4a5a7d">self-registration stays refused in private mode; the admin is always the one who hands out keys.</text>
</svg>
