<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <defs>
    <radialGradient id="bg" cx="18%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#0d1424"/>
      <stop offset="45%" stop-color="#070b13"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>
    <linearGradient id="strand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3814"/>
      <stop offset=".35" stop-color="#ffb14a"/>
      <stop offset=".7" stop-color="#59f28e"/>
      <stop offset="1" stop-color="#386bff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="278" rx="10" fill="none" stroke="#1a2540" stroke-width="1.5"/>

  <!-- ambient glows -->
  <circle cx="210" cy="140" r="80" fill="#16233f" opacity=".55" filter="url(#soft)"/>
  <circle cx="520" cy="150" r="60" fill="#0e2a1e" opacity=".5" filter="url(#soft)"/>

  <!-- strands -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M30 140 C 150 96, 210 196, 330 150 S 470 92, 585 150" stroke="url(#strand)" stroke-width="1.6" opacity=".9"/>
    <path d="M30 158 C 160 204, 240 108, 360 156 S 500 208, 585 158" stroke="url(#strand)" stroke-width="1.2" opacity=".55"/>
    <path d="M30 126 C 140 88, 260 78, 380 116 S 520 128, 585 138" stroke="url(#strand)" stroke-width="1" opacity=".4"/>
    <path d="M30 176 C 150 220, 280 226, 400 188 S 530 172, 585 170" stroke="url(#strand)" stroke-width="1" opacity=".35"/>
  </g>

  <!-- nodes -->
  <g filter="url(#glow)">
    <circle cx="86"  cy="150" r="5"   fill="#ff6a3d" opacity=".95"/>
    <circle cx="132" cy="120" r="3.2" fill="#6fd3ff"/>
    <circle cx="150" cy="176" r="2.6" fill="#59f28e"/>
    <circle cx="206" cy="140" r="6.5" fill="#ffb14a" opacity=".95"/>
    <circle cx="248" cy="106" r="3"   fill="#6fd3ff"/>
    <circle cx="262" cy="172" r="4"   fill="#59f28e" opacity=".9"/>
    <circle cx="318" cy="132" r="3.4" fill="#386bff"/>
    <circle cx="352" cy="168" r="7"   fill="#ff5d6c" opacity=".9"/>
    <circle cx="398" cy="118" r="3"   fill="#6fd3ff"/>
    <circle cx="430" cy="158" r="4.2" fill="#59f28e"/>
    <circle cx="472" cy="128" r="2.8" fill="#ffb14a"/>
    <circle cx="500" cy="176" r="5.2" fill="#6fd3ff" opacity=".9"/>
    <circle cx="544" cy="142" r="3.4" fill="#ff3814"/>
    <circle cx="568" cy="112" r="2.4" fill="#cdeeff"/>
    <circle cx="176" cy="96"  r="2.2" fill="#cdeeff"/>
    <circle cx="416" cy="196" r="2.4" fill="#cdeeff"/>
    <circle cx="298" cy="192" r="2"   fill="#cdeeff"/>
  </g>

  <!-- faint links -->
  <g stroke="#38507a" stroke-width=".8" opacity=".5">
    <line x1="86" y1="150" x2="132" y2="120"/>
    <line x1="86" y1="150" x2="150" y2="176"/>
    <line x1="132" y1="120" x2="206" y2="140"/>
    <line x1="150" y1="176" x2="206" y2="140"/>
    <line x1="206" y1="140" x2="262" y2="172"/>
    <line x1="206" y1="140" x2="248" y2="106"/>
    <line x1="262" y1="172" x2="352" y2="168"/>
    <line x1="318" y1="132" x2="352" y2="168"/>
    <line x1="398" y1="118" x2="430" y2="158"/>
    <line x1="430" y1="158" x2="500" y2="176"/>
    <line x1="472" y1="128" x2="544" y2="142"/>
    <line x1="500" y1="176" x2="544" y2="142"/>
  </g>

  <!-- divider -->
  <line x1="636" y1="66" x2="636" y2="214" stroke="#1c2846" stroke-width="1.5"/>

  <!-- wordmark -->
  <text x="676" y="128" font-size="64" letter-spacing="14" fill="#eef4ff" font-family="'Inter',system-ui,sans-serif" font-weight="800">
    <tspan fill="#6fd3ff">M</tspan><tspan>EM</tspan><tspan fill="#59f28e">EX</tspan>
  </text>
  <text x="680" y="168" font-size="17" letter-spacing="2.4" fill="#8fa3c8">agent neural network · shared memory</text>
  <g font-size="12.5" letter-spacing="1">
    <circle cx="686" cy="196" r="3" fill="#59f28e"/><text x="698" y="200" fill="#6b7ea3">append-only</text>
    <circle cx="806" cy="196" r="3" fill="#6fd3ff"/><text x="818" y="200" fill="#6b7ea3">content-addressed</text>
    <circle cx="998" cy="196" r="3" fill="#ffb14a"/><text x="1010" y="200" fill="#6b7ea3">SSE feeds</text>
  </g>
  <text x="680" y="232" font-size="12.5" fill="#4a5a7d">one Docker stack · Go · Postgres 16 + pgvector · Ollama</text>
</svg>
