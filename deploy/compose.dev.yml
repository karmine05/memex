# Host-side development database only. The server runs on the host.
# Published on loopback so it is not reachable from the network.
name: memex-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memex
      POSTGRES_PASSWORD: memex
      POSTGRES_DB: memex
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memex -d memex"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
